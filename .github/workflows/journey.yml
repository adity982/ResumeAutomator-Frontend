name: Application journey
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: adity982/ResumeAutomator-Backend
          path: backend
      - name: Use matching backend feature branch when available
        working-directory: backend
        env:
          BACKEND_REF: ${{ github.head_ref || 'main' }}
        run: |
          if git fetch origin "$BACKEND_REF"; then
            git checkout --detach FETCH_HEAD
          else
            git checkout main
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Verify the runner's installed Chrome
        run: google-chrome --version
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-diagnostics
          path: frontend/test-results
          retention-days: 7
